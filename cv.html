<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моё IT CV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cv-container">
    <div class="cv-header">
        <h1 id="cvName"></h1>
        <h2 id="cvProfession"></h2>
        <p id="cvLocation"></p>
    </div>

    <div class="cv-section">
        <h3>Контакты</h3>
        <p>Email: <span id="cvEmail"></span></p>
        <p>Телефон: <span id="cvPhone"></span></p>
        <p>GitHub: <span id="cvGithub"></span></p>
        <p>LinkedIn: <span id="cvLinkedin"></span></p>
    </div>

    <div class="cv-section">
        <h3>О себе</h3>
        <p id="cvAbout"></p>
    </div>

    <div class="cv-section">
        <h3>Технический стек</h3>
        <ul id="cvTechStack"></ul>
    </div>

    <div class="cv-section">
        <h3>Навыки</h3>
        <ul id="cvSkills"></ul>
    </div>

    <div class="cv-section">
        <h3>Опыт работы</h3>
        <div id="cvExperience"></div>
    </div>

    <div class="cv-section">
        <h3>Проекты</h3>
        <div id="cvProjects"></div>
    </div>

    <div class="cv-section">
        <h3>Образование</h3>
        <div id="cvEducation"></div>
    </div>

    <div class="cv-section">
        <h3>Сертификаты</h3>
        <ul id="cvCertificates"></ul>
    </div>

    <div class="cv-section">
        <h3>Языки</h3>
        <ul id="cvLanguages"></ul>
    </div>

    <a href="index.html" class="back-btn">Редактировать</a>
</div>

<script src="script.js"></script>
</body>
</html>
